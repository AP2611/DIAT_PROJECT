  severity: WARNING
- id: c.lang.security.use-after-free.use-after-free
  patterns:
  - pattern-either:
    - pattern: $VAR->$ACCESSOR
    - pattern: (*$VAR).$ACCESSOR
    - pattern: $VAR[$NUM]
  - pattern-inside: free($VAR); ...
  - pattern-not-inside: $VAR = NULL; ...
  - pattern-not-inside: free($VAR); ... $VAR = malloc(...); ...
  message: Variable '$VAR' was used after being freed. This can lead to undefined
    behavior.
  metadata:
    cwe:
    - 'CWE-416: Use After Free'
    references:
    - https://cwe.mitre.org/data/definitions/416.html
    - https://ctf-wiki.github.io/ctf-wiki/pwn/linux/glibc-heap/use_after_free/
    category: security
    technology:
    - c
    confidence: LOW
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: LOW
    impact: HIGH
    license: Semgrep Rules License v1.0. For more details, visit semgrep.dev/legal/rules-license
    vulnerability_class:
    - Memory Issues
    source: https://semgrep.dev/r/c.lang.security.use-after-free.use-after-free
    shortlink: https://sg.run/gL6e
    semgrep.dev:
      rule:
        r_id: 8841
        rv_id: 945178
        rule_id: KxUb9l
        version_id: 1QToKPy
        url: https://semgrep.dev/playground/r/1QToKPy/c.lang.security.use-after-free.use-after-free
        origin: community
        path: c.lang.security.use-after-free.use-after-free
  languages:
  - c
  - cpp
  severity: WARNING
- id: research.c.unbounded-string-copy
  languages:
  - c
  - cpp
  severity: ERROR
  message: Unbounded string copy/concatenation into a fixed-size buffer may overflow.
  metadata:
    cwe:
    - CWE-120
  pattern-either:
  - pattern: strcpy($DST, $SRC)
  - pattern: strcat($DST, $SRC)
  - pattern: sprintf($DST, ...)
  - pattern: vsprintf($DST, ...)
  - pattern: gets($DST)
- id: research.c.command-execution
  languages:
  - c
  - cpp
  severity: ERROR
  message: Command execution with a non-literal argument; verify it is not attacker-controlled.
  metadata:
    cwe:
    - CWE-78
  pattern-either:
  - pattern: system($CMD)
  - pattern: popen($CMD, ...)
  - pattern: execl($CMD, ...)
  - pattern: execlp($CMD, ...)
- id: research.c.allocation-size-multiply
  languages:
  - c
  - cpp
  severity: WARNING
  message: Allocation size computed by multiplication; check for integer overflow.
  metadata:
    cwe:
    - CWE-190
  pattern-either:
  - pattern: malloc($A * $B)
  - pattern: calloc($A, $B)
- id: research.c.unchecked-allocation-deref
  languages:
  - c
  - cpp
  severity: WARNING
  message: Allocation result is dereferenced without an obvious NULL check.
  metadata:
    cwe:
    - CWE-476
  patterns:
  - pattern: $PTR = malloc(...);
  - pattern: $PTR->$FIELD
