# Research Semgrep ruleset for PrimeVul (C/C++) pilots.
# Includes vetted Semgrep registry C rules (p/security-audit, retrieved 2026-11-18)
# plus local high-signal patterns and the original Python/JS smoke rules.
# This is still a research ruleset, not a production security pack.
rules:
- id: research.python.sql-injection-format
  languages:
  - python
  severity: ERROR
  message: Possible SQL injection via string formatting into a query.
  metadata:
    cwe:
    - CWE-89
  pattern-either:
  - pattern: '$QUERY = "..." % $X

      '
  - pattern: '$QUERY = f"...{$X}..."

      '
  - pattern: '$CUR.execute("..." % $X)

      '
  - pattern: '$CUR.execute(f"...{$X}...")

      '
- id: research.python.os-system
  languages:
  - python
  severity: ERROR
  message: Possible command injection via os.system.
  metadata:
    cwe:
    - CWE-78
  pattern: os.system($CMD)
- id: research.javascript.eval
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: Use of eval may allow code injection.
  metadata:
    cwe:
    - CWE-95
  pattern: eval($X)
- id: c.lang.security.double-free.double-free
  patterns:
  - pattern-not: 'free($VAR);

      ...

      $VAR = NULL;

      ...

      free($VAR);

      '
  - pattern-not: 'free($VAR);

      ...

      $VAR = malloc(...);

      ...

      free($VAR);

      '
  - pattern-inside: 'free($VAR);

      ...

      $FREE($VAR);

      '
  - metavariable-pattern:
      metavariable: $FREE
      pattern: free
  - focus-metavariable: $FREE
  message: Variable '$VAR' was freed twice. This can lead to undefined behavior.
  metadata:
    cwe:
    - 'CWE-415: Double Free'
    owasp:
    - A03:2021 - Injection
    - A01:2017 - Injection
    - A05:2025 - Injection
    references:
    - https://cwe.mitre.org/data/definitions/415.html
    - https://owasp.org/www-community/vulnerabilities/Doubly_freeing_memory
    category: security
    technology:
    - c
    confidence: LOW
    subcategory:
    - vuln
    likelihood: LOW
    impact: HIGH
    license: Semgrep Rules License v1.0. For more details, visit semgrep.dev/legal/rules-license
    vulnerability_class:
    - Memory Issues
    source: https://semgrep.dev/r/c.lang.security.double-free.double-free
    shortlink: https://sg.run/eLl0
    semgrep.dev:
      rule:
        r_id: 8832
        rv_id: 1262604
        rule_id: JDUyw8
        version_id: RGT0L3W
        url: https://semgrep.dev/playground/r/RGT0L3W/c.lang.security.double-free.double-free
        origin: community
        path: c.lang.security.double-free.double-free
  languages:
  - c
  - cpp
  severity: ERROR
- id: c.lang.security.insecure-use-gets-fn.insecure-use-gets-fn
  pattern: gets(...)
  message: Avoid 'gets()'. This function does not consider buffer boundaries and can
    lead to buffer overflows. Use 'fgets()' or 'gets_s()' instead.
  metadata:
    cwe:
    - 'CWE-676: Use of Potentially Dangerous Function'
    references:
    - https://us-cert.cisa.gov/bsi/articles/knowledge/coding-practices/fgets-and-gets_s
    category: security
    technology:
    - c
    confidence: MEDIUM
    subcategory:
    - audit
    likelihood: LOW
    impact: HIGH
    license: Semgrep Rules License v1.0. For more details, visit semgrep.dev/legal/rules-license
    vulnerability_class:
    - Dangerous Method or Function
    source: https://semgrep.dev/r/c.lang.security.insecure-use-gets-fn.insecure-use-gets-fn
    shortlink: https://sg.run/dKqX
    semgrep.dev:
      rule:
        r_id: 8834
        rv_id: 945170
        rule_id: GdU7OE
        version_id: YDTvRlQ
        url: https://semgrep.dev/playground/r/YDTvRlQ/c.lang.security.insecure-use-gets-fn.insecure-use-gets-fn
        origin: community
        path: c.lang.security.insecure-use-gets-fn.insecure-use-gets-fn
  languages:
  - c
  - cpp
  severity: ERROR
- id: c.lang.security.insecure-use-printf-fn.insecure-use-printf-fn
  message: Avoid using user-controlled format strings passed into 'sprintf', 'printf'
    and 'vsprintf'. These functions put you at risk of buffer overflow vulnerabilities
    through the use of format string exploits. Instead, use 'snprintf' and 'vsnprintf'.
  metadata:
    cwe:
    - 'CWE-134: Use of Externally-Controlled Format String'
    references:
    - https://doc.castsoftware.com/display/SBX/Never+use+sprintf%28%29+or+vsprintf%28%29+functions
    - https://www.cvedetails.com/cwe-details/134/Uncontrolled-Format-String.html
    category: security
    technology:
    - c
    confidence: LOW
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    license: Semgrep Rules License v1.0. For more details, visit semgrep.dev/legal/rules-license
    vulnerability_class:
    - Improper Validation
    source: https://semgrep.dev/r/c.lang.security.insecure-use-printf-fn.insecure-use-printf-fn
    shortlink: https://sg.run/ZvJx
    semgrep.dev:
      rule:
        r_id: 8835
        rv_id: 945172
        rule_id: ReUgWx
        version_id: o5TZeB2
        url: https://semgrep.dev/playground/r/o5TZeB2/c.lang.security.insecure-use-printf-fn.insecure-use-printf-fn
        origin: community
        path: c.lang.security.insecure-use-printf-fn.insecure-use-printf-fn
  languages:
  - c
  - cpp
  severity: WARNING
  patterns:
  - pattern-either:
    - pattern: '$FUNC($BUFFER, argv[$NUM], ...);

        ...

        vsprintf(..., $BUFFER, ...);

        '
    - pattern: vsprintf(..., argv[$NUM], ...)
    - pattern: '$FUNC($BUFFER, argv[$NUM], ...);

        ...

        sprintf(..., $BUFFER, ...);

        '
    - pattern: sprintf(...,argv[$NUM],...)
    - pattern: '$FUNC($BUFFER, argv[$NUM], ...);

        ...

        printf(..., $BUFFER, ...);

        '
    - pattern: printf(...,argv[$NUM],...)
  - metavariable-comparison:
      metavariable: $NUM
      comparison: int($NUM) > 0
